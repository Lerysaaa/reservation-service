services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reservations
      POSTGRES_USER: reservations
      POSTGRES_PASSWORD: reservations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservations -d reservations"]
      interval: 2s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://reservations:reservations@postgres:5432/reservations?sslmode=disable
    ports:
      - "8080:8080"

volumes:
  postgres_data:
